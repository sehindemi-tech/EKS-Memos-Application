replicaCount: 3
rollingUpdate:
  maxUnavailable: 1
  maxSurge: 1
matchLabels:
  app: memos-app
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
image:
  repository: 441336784821.dkr.ecr.eu-west-2.amazonaws.com/eks-memos-application
  tag: sha-3c67c7c
  digest: ""
containerPort: 5230
dsn:
  secretName: memos-dsn
  secretKey: dsn
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 100m
    memory: 128Mi
##ingress.yml
hostname: memo.sehindemi.com
clusterIssuer: letsencrypt-https
## limit ranges
limitRange:
  default:
    cpu: 200m
    memory: 256Mi
  defaultRequest:
    cpu: 100m
    memory: 128Mi
  min:
    cpu: 50m
    memory: 64Mi
  max:
    cpu: 500m
    memory: 512Mi
