providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

ports:
  web:
    port: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    port: 443

service:
  type: LoadBalancer

ingressRoute:
  dashboard:
    enabled: false

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

deployment:
  replicas: 2

resources:
  requests:
    cpu: 100m
    memory: 50Mi
  limits:
    cpu: 300m
    memory: 150Mi