name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
        default: dev
      confirm:
        description: 'Type the exact string DESTROY to confirm'
        required: true
        type: string

concurrency:
  group: terraform-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_WORKING_DIR: infra/terraform/env/dev

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/env/${{ github.event.inputs.environment }}
    steps:
      - name: Verify confirmation string
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation string did not match. Aborting."
            exit 1
          fi

      - name: Git checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DESTROY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch tfvars from S3
        run: aws s3 cp s3://eks-memo-application-eks-441336784821/terraform.tfvars terraform.tfvars

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"

      - name: Terraform init
        run: terraform init

      - name: Terraform destroy
        run: terraform destroy -auto-approve